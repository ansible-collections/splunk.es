---
- name: Deploy Training Progress dashboard XML
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ splunk_port | default(8089) }}/servicesNS/nobody/{{ ai_dashboards_splunk_app }}/data/ui/views"
    method: POST
    user: "{{ splunk_user | default('admin') }}"
    password: "{{ splunk_password }}"
    force_basic_auth: true
    validate_certs: "{{ splunk_validate_certs | default(false) }}"
    body_format: form-urlencoded
    body:
      name: ai_factory_training_progress
      eai:data: "{{ lookup('template', 'training_progress_dashboard.xml.j2') }}"
    status_code:
      - 200
      - 201
      - 409
  register: _training_dashboard_result
  changed_when: _training_dashboard_result.status in [200, 201]
