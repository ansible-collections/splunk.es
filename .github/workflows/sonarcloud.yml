---
name: "Collection SonarCloud"

concurrency:
  group: ${{ github.head_ref || github.run_id }}-checks
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  pull_request_target:
    branches: [main]

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Environment gate requires a maintainer to approve the deployment before
    # this job runs, ensuring untrusted PR code is reviewed before secrets
    # (ANSIBLE_COLLECTIONS_ORG_SONAR_TOKEN_CICD_BOT) are accessible.
    environment: eco-splunk-protected
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
          allow-unsafe-pr-checkout: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python and testing dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core pytest pytest-cov pytest-ansible-units pytest-forked pytest-xdist lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Ansible Galaxy dependencies
        run: |
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              ansible-galaxy collection install "$line"
            fi
          done <<< "git+https://github.com/ansible-collections/ansible.utils.git"

      - name: Prepare SonarCloud args
        id: sonar-args
        run: |
          if [ "${{ github.event_name }}" == "pull_request_target" ]; then
            ARGS="-Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}"
            ARGS="$ARGS -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}"
            ARGS="$ARGS -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}"
            ARGS="$ARGS -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}"
            echo "ARGS=$ARGS" >> $GITHUB_OUTPUT
          else
            echo "ARGS=" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests with coverage
        run: pytest tests/unit -v --cov-report xml --cov=./

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.ANSIBLE_COLLECTIONS_ORG_SONAR_TOKEN_CICD_BOT }}
          SONAR_SCANNER_JAVA_OPTS: "-Xss2m"
        with:
          args: >
            ${{ steps.sonar-args.outputs.ARGS }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
