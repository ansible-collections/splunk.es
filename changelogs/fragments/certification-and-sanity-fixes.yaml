---
bugfixes:
  - plugins/module_utils/splunk.py - wrapped the ``ansible.utils`` collection import
    in a ``try/except`` block so that ``ansible-test sanity --test import`` no longer
    raises ``ModuleNotFoundError`` in the isolated sanity environment.

minor_changes:
  - certification.yml - added Red Hat partner certification workflow running
    ``ansible-lint`` (profile ``production``) and ``ansible-test sanity`` against
    Ansible stable-2.16, stable-2.18, and stable-2.20.
  - .ansible-lint - added ``exclude_paths`` entry for ``.ansible/`` to prevent
    ansible-lint from scanning installed collection dependencies.
  - .yamllint - added ``.ansible/`` to the ``ignore`` list for the same reason.
  - changelogs/changelog.yaml and changelogs/config.yaml - added missing ``---``
    document-start marker required by the ``yaml[document-start]`` yamllint rule.
